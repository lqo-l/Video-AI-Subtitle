<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>双语字幕助手设置</title><style>body{max-width:720px;margin:40px auto;background:#121419;color:#eef1f5;font:15px Arial}label{display:block;margin:16px 0 6px}input,select{width:100%;padding:9px;background:#20242c;color:#fff;border:1px solid #414958;border-radius:6px;box-sizing:border-box}button{margin-top:22px;padding:10px 18px;background:#2867d6;color:#fff;border:0;border-radius:6px}#message{margin-left:12px}</style></head><body><h1>YouTube 双语字幕助手</h1><p>配置只保存在本机服务的数据目录，不会写入扩展包。</p><form id="form"><label>OpenAI 兼容 Base URL</label><input id="base_url" required><label>API Key（保存设置时需要重新填写）</label><input id="api_key" type="password" required autocomplete="off"><label>翻译模型</label><input id="translation_model" required><label>摘要模型</label><input id="summary_model" required><label>Whisper 模型</label><select id="whisper_model"><option>tiny.en</option><option>base.en</option><option selected>small.en</option><option>medium.en</option></select><label>运行设备</label><select id="device"><option value="auto">自动（GPU 优先，失败转 CPU）</option><option value="cuda">仅 NVIDIA GPU</option><option value="cpu">仅 CPU</option></select><button>保存设置</button><span id="message"></span></form><script src="options.js"></script></body></html>
