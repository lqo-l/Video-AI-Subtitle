<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>双语字幕助手设置</title>
  <style>
    :root{color-scheme:dark}*{box-sizing:border-box}body{max-width:820px;margin:36px auto;padding:0 20px;background:#101218;color:#eef1f7;font:15px/1.55 Arial,"Microsoft YaHei",sans-serif}h1{margin-bottom:6px}h2,h3{margin:0}h2{font-size:17px}h3{font-size:16px}.card{margin:20px 0;padding:22px;background:linear-gradient(145deg,#181c25,#151820);border:1px solid #303745;border-radius:14px;box-shadow:0 12px 35px #0003}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.wide{grid-column:1/-1}.field-head,.group-head,.status-line{display:flex;align-items:center;justify-content:space-between;gap:12px}.field-head label{margin:0}.field-head{margin-bottom:6px}label{display:block;margin-bottom:6px;color:#dce2ee}input,select{width:100%;padding:10px 11px;background:#222733;color:#fff;border:1px solid #424b5c;border-radius:7px;transition:border-color .16s ease,box-shadow .16s ease,background .16s ease}input:hover,select:hover{border-color:#58657a}input:focus-visible,select:focus-visible{outline:0;border-color:#6c9cff;box-shadow:0 0 0 3px #3978e833}input[readonly]{color:#c3ccdb;background:#1c212b}small{display:block;margin-top:5px;color:#9da8b8}details summary{display:flex;align-items:center;justify-content:space-between;cursor:pointer;list-style:none}details summary::after{content:"＋";font-size:21px;color:#78a4ff}details[open] summary::after{content:"−"}.details-body{margin-top:20px;padding-top:18px;border-top:1px solid #303745}.settings-group{padding:18px;background:#10141c;border:1px solid #303846;border-radius:11px}.group-fields{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:15px}.core-field{margin-top:15px}.path-picker{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:9px}.path-picker button{white-space:nowrap}.actions{position:relative;display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:16px}button{padding:10px 16px;color:#fff;background:#3978e8;border:1px solid transparent;border-radius:7px;cursor:pointer;transition:transform .12s ease,background .16s ease,border-color .16s ease,box-shadow .16s ease}button.secondary{background:#343b49}button:not(:disabled):hover{background:#4a86ef;box-shadow:0 5px 14px #1e55b84d}button.secondary:not(:disabled):hover{background:#414a5b;border-color:#59667c;box-shadow:0 5px 14px #0003}button:not(:disabled):active{transform:translateY(1px) scale(.98);box-shadow:none}button:focus-visible{outline:0;box-shadow:0 0 0 3px #78a4ff4d}button:disabled{opacity:.5;cursor:default}.advanced-options{margin-top:14px;border-top:1px solid #29313e}.advanced-options>summary,.advanced-options[open]>summary{justify-content:flex-start;gap:8px;padding:12px 2px 0;color:#aeb9ca;font-size:13px;font-weight:600}.advanced-options>summary::-webkit-details-marker{display:none}.advanced-options>summary::before{content:"›";color:#78a4ff;font-size:18px;line-height:1;transition:transform .16s ease}.advanced-options[open]>summary::before{transform:rotate(90deg)}.advanced-options>summary::after,.advanced-options[open]>summary::after{content:none}.advanced-options>summary:hover{color:#e2e8f2}.advanced-body{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:13px;padding:15px;background:#151a23;border:1px solid #29313e;border-radius:9px}.advanced-actions{display:flex;gap:9px;flex-wrap:wrap}.advanced-actions button{padding:8px 12px;font-size:13px}.advanced-actions .danger-secondary{color:#ffabb0}.prompt-actions{gap:14px;margin-top:20px;padding-top:15px;border-top:1px solid #29313e}.prompt-actions button{min-width:164px}.status-value{min-width:42px;text-align:right;color:#9da8b8;font-size:13px;font-variant-numeric:tabular-nums}.status-value.ready{color:#65d59a}.status-value.failed{color:#ff8b91}.status-value.checking::before{content:"";display:inline-block;width:7px;height:7px;margin-right:6px;border:1.5px solid currentColor;border-right-color:transparent;border-radius:50%;vertical-align:0;animation:status-spin .75s linear infinite}.progress{height:7px;margin:13px 0 0;background:#2c3340;border-radius:9px;overflow:hidden}.progress[hidden]{display:none}.progress i{display:block;width:0;height:100%;background:linear-gradient(90deg,#4b8cff,#9575ff);transition:width .25s ease-out}.status-detail{margin-top:10px;word-break:break-word;color:#aab5c8;font-size:12px;font-variant-numeric:tabular-nums}.range-row{display:grid;grid-template-columns:max-content minmax(0,1fr) max-content;align-items:center;gap:14px;margin-top:13px}.range-row label{margin:0;white-space:nowrap}.range-row input{min-width:0;padding:0}.range-row output{min-width:44px;color:#8fb3ff;text-align:right}dialog{max-width:520px;padding:22px;color:#eef1f7;background:#181c25;border:1px solid #3c4658;border-radius:13px;box-shadow:0 24px 70px #0009}dialog::backdrop{background:#05070ba8;backdrop-filter:blur(2px)}dialog p{margin:12px 0 0;color:#b8c2d2}dialog .actions{justify-content:flex-end}@keyframes status-spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){*,*::before{scroll-behavior:auto!important;transition-duration:0s!important;animation-duration:0s!important}}@media(max-width:650px){.grid,.group-fields,.advanced-body{grid-template-columns:1fr}.wide{grid-column:auto}.prompt-actions button{min-width:0}}
  </style>
</head>
<body>
  <h1>视频 AI 双语字幕助手</h1>
  <form id="form">
    <section class="card">
      <h2>模型服务</h2>
      <div class="grid">
        <div class="wide"><label for="base_url">OpenAI 兼容 Base URL</label><input id="base_url" required></div>
        <div class="wide"><label for="api_key">API Key</label><input id="api_key" type="password" autocomplete="off" placeholder="尚未配置"><small>已配置时显示占位符，不输入新值不会修改原 Key。</small></div>
        <div><label for="translation_model">翻译模型</label><input id="translation_model" required value="deepseek-v4-flash"></div>
        <div><label for="summary_model">摘要模型</label><input id="summary_model" required></div>
      </div>
    </section>
    <details class="card">
      <summary><h2>更多设置</h2></summary>
      <div class="details-body grid">
        <section class="wide settings-group">
          <div class="group-head"><h3>Whisper 模型</h3><span id="model_state" class="status-value">尚未检查</span></div>
          <div class="core-field"><label for="whisper_model">模型</label><select id="whisper_model"><option value="tiny">tiny</option><option value="base">base</option><option value="small" selected>small</option><option value="medium">medium</option></select></div>
          <div id="model_progress" class="progress" hidden><i id="model_bar"></i></div>
          <div id="model_detail" class="status-detail" hidden></div>
          <div class="actions"><button type="button" id="check_model" class="secondary">检查模型</button><button type="button" id="download_model">下载 / 继续下载</button><button type="button" id="cancel_model_download" class="secondary cancel-download" hidden>取消下载</button></div>
          <details class="advanced-options" id="model_more"><summary>高级选项</summary><div class="advanced-body"><div class="wide"><label for="whisper_download_source">下载源</label><select id="whisper_download_source"><option value="auto">自动（镜像优先，官方回退）</option><option value="mirror">仅 Hugging Face 镜像</option><option value="official">仅 Hugging Face 官方</option></select></div><div class="wide"><label for="model_install_dir">安装位置</label><div class="path-picker"><input id="model_install_dir" readonly><button type="button" id="choose_model_dir" class="secondary">选择文件夹</button></div></div><div class="wide"><label for="whisper_model_path">使用已有模型（可选）</label><input id="whisper_model_path" placeholder="直接使用其他位置的完整模型，不影响安装位置"></div><div class="wide advanced-actions"><button type="button" id="reset_model_dir" class="secondary">恢复默认路径</button><button type="button" id="open_model" class="secondary" disabled>打开模型文件夹</button><button type="button" id="clear_model_cache" class="secondary danger-secondary">清理下载缓存</button></div></div></details>
        </section>
        <section class="wide settings-group">
          <div class="group-head"><h3>GPU 加速</h3><span id="cuda_state" class="status-value">尚未检查</span></div>
          <div class="core-field"><label for="device">运行设备</label><select id="device"><option value="cpu">仅 CPU（默认，无需额外配置）</option><option value="auto">自动（GPU 优先，失败转 CPU）</option><option value="cuda">仅 NVIDIA GPU</option></select></div>
          <div id="cuda_progress" class="progress" hidden><i id="cuda_bar"></i></div>
          <div id="cuda_detail" class="status-detail" hidden></div>
          <div class="actions"><button type="button" id="check_cuda" class="secondary">检查 GPU 环境</button><button type="button" id="install_cuda">一键配置 GPU</button><button type="button" id="cancel_cuda_download" class="secondary cancel-download" hidden>取消下载</button></div>
          <details class="advanced-options" id="cuda_more"><summary>高级选项</summary><div class="advanced-body"><div class="wide"><label for="cuda_install_dir">运行库安装位置</label><div class="path-picker"><input id="cuda_install_dir" readonly><button type="button" id="choose_cuda_dir" class="secondary">选择文件夹</button></div></div><div class="wide advanced-actions"><button type="button" id="reset_cuda_dir" class="secondary">恢复默认路径</button><button type="button" id="open_cuda" class="secondary" disabled>打开运行库文件夹</button><button type="button" id="clear_cuda_cache" class="secondary danger-secondary">清理下载缓存</button></div></div></details>
        </section>
        <section class="wide settings-group"><div class="group-head"><h3>面板</h3></div><div class="range-row"><label for="panel_opacity">背景透明度</label><input id="panel_opacity" type="range" min="72" max="100" value="94"><output id="opacity_value">94%</output></div></section>
        <section class="wide settings-group"><div class="group-head"><h3>提示词</h3></div><small>修改前建议备份。翻译提示词需保留 <code>{language_name}</code>；摘要提示词需保留 <code>## 内容摘要</code> 与 <code>## 关键点</code>，否则翻译解析或流式摘要显示可能失败。</small><div class="group-fields"><div class="wide"><label for="prompt_dir">提示词文件位置</label><input id="prompt_dir" readonly></div></div><div class="advanced-actions prompt-actions"><button type="button" id="open_prompts" class="secondary">打开提示词文件夹</button><button type="button" id="restore_translation_prompt" class="secondary">恢复默认翻译提示词</button><button type="button" id="restore_summary_prompt" class="secondary">恢复默认摘要提示词</button></div></section>
        <section class="wide settings-group"><div class="group-head"><h3>诊断日志</h3></div><small>记录任务、模型下载、CUDA 安装和本机服务错误，用于排查问题。日志不会记录 API Key、Cookie 或字幕正文；旧日志会自动轮转。</small><div class="advanced-actions prompt-actions"><button type="button" id="open_diagnostics" class="secondary">打开诊断日志文件夹</button></div></section>
      </div>
    </details>
    <div class="actions"><button>保存设置</button><button type="button" class="secondary" id="reset_translation">恢复默认翻译模型</button><span id="message"></span></div>
  </form>
  <dialog id="migration_dialog"><h3>迁移已有文件？</h3><p id="migration_text"></p><div class="actions"><button type="button" class="secondary" data-migration="cancel">取消</button><button type="button" class="secondary" data-migration="keep">仅切换位置</button><button type="button" data-migration="migrate">迁移并切换</button></div></dialog>
  <script src="options.js"></script>
</body>
</html>
<!-- Moon End -->
