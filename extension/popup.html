<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><style>body{width:260px;padding:14px;background:#15171c;color:#fff;font:14px Arial}button{width:100%;margin-top:8px;padding:9px;border:0;border-radius:6px;background:#2867d6;color:#fff;cursor:pointer}.secondary{background:#343945}.danger{background:#6b3035}button:disabled{opacity:.55;cursor:default}#status{color:#abb3c0;margin-bottom:8px}.update{display:none;margin:0 0 10px;padding:9px 10px;border:1px solid #4d78c7;border-radius:8px;background:#1c2a43;color:#d9e7ff}.update.show{display:block}.update strong{display:block}.update small{display:block;margin-top:3px;color:#aebfdc}.update-actions{display:flex;gap:7px}.update-actions button{margin-top:8px}.update-actions button{width:auto;flex:1}.update-progress{display:none;margin-top:8px}.update-progress.show{display:block}.update-progress-text{display:block;margin-bottom:5px;color:#c8d8f4;font-size:12px;font-variant-numeric:tabular-nums}.update-progress-bar{height:5px;overflow:hidden;border-radius:99px;background:#142039}.update-progress-bar i{display:block;width:0;height:100%;border-radius:inherit;background:#74a8ff;transition:width .2s ease}.update-progress.indeterminate .update-progress-bar i{width:35%;animation:update-progress 1.1s ease-in-out infinite}@keyframes update-progress{0%{transform:translateX(-120%)}100%{transform:translateX(340%)}}.update-status{display:none;margin:5px 0 -1px;color:#91d8af;font-size:12px}.update-status.show{display:block}</style></head><body><div class="update" id="update"><strong id="update_title"></strong><small id="update_note"></small><div class="update-progress" id="update_progress"><span class="update-progress-text" id="update_progress_text"></span><div class="update-progress-bar"><i id="update_progress_bar"></i></div></div><div class="update-actions"><button id="install_update">立即更新</button><button class="secondary" id="open_update">查看说明</button></div></div><div id="status">检查本机服务…</div><button id="start">处理当前视频</button><button class="secondary" id="options">设置</button><button class="secondary" id="check_update">检查插件更新</button><div class="update-status" id="update_status" role="status"></div><button class="danger" id="clear_cache">清理字幕缓存</button><script src="popup.js"></script></body></html>
