<!-- Moon Begin -->
<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>双语字幕助手设置</title>
  <style>
    :root{color-scheme:dark}*{box-sizing:border-box}body{max-width:820px;margin:36px auto;padding:0 20px;background:#101218;color:#eef1f7;font:15px/1.55 Arial,"Microsoft YaHei",sans-serif}h1{margin-bottom:6px}h2{font-size:17px;margin:0}small{color:#9da8b8}.card{margin:20px 0;padding:22px;background:linear-gradient(145deg,#181c25,#151820);border:1px solid #303745;border-radius:14px;box-shadow:0 12px 35px #0003}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.wide{grid-column:1/-1}label{display:block;margin-bottom:6px;color:#dce2ee}input,select{width:100%;padding:10px 11px;background:#222733;color:#fff;border:1px solid #424b5c;border-radius:7px}small{display:block;margin-top:5px}details summary{display:flex;align-items:center;justify-content:space-between;cursor:pointer;list-style:none}details summary::after{content:"＋";font-size:21px;color:#78a4ff}details[open] summary::after{content:"−"}.details-body{margin-top:20px;padding-top:18px;border-top:1px solid #303745}.actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:20px}button{padding:10px 16px;background:#3978e8;color:#fff;border:0;border-radius:7px;cursor:pointer}button.secondary{background:#343b49}button:disabled{opacity:.5;cursor:default}.model-status{margin-top:15px;padding:14px;background:#10141c;border:1px solid #303846;border-radius:9px}.status-line{display:flex;align-items:center;justify-content:space-between;gap:12px}.status-value{min-width:42px;text-align:right;color:#9da8b8;font-size:13px;font-variant-numeric:tabular-nums}.status-value.ready{color:#65d59a}.status-value.failed{color:#ff8b91}.status-value.checking{animation:status-checking 1s ease-in-out infinite}.status-value.checking::before{content:"";display:inline-block;width:7px;height:7px;margin-right:6px;border:1.5px solid currentColor;border-right-color:transparent;border-radius:50%;vertical-align:0;animation:status-spin .75s linear infinite}.progress{height:7px;margin:11px 0;background:#2c3340;border-radius:9px;overflow:hidden}.progress[hidden]{display:none}.progress i{display:block;width:0;height:100%;background:linear-gradient(90deg,#4b8cff,#9575ff);transition:width .25s ease-out}.path{min-height:19px;margin-top:9px;word-break:break-word;color:#aab5c8;font-size:12px;font-variant-numeric:tabular-nums}.range-row{display:flex;align-items:center;gap:14px}.range-row input{padding:0}.range-row output{min-width:44px;color:#8fb3ff}@keyframes status-checking{50%{opacity:.62}}@keyframes status-spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.status-value.checking,.status-value.checking::before{animation:none}.status-value.checking::before{border-right-color:currentColor}}@media(max-width:650px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}}
  </style>
</head>
<body>
  <h1>视频 AI 双语字幕助手</h1>
  <form id="form">
    <section class="card">
      <h2>模型服务</h2>
      <div class="grid">
        <div class="wide"><label for="base_url">OpenAI 兼容 Base URL</label><input id="base_url" required></div>
        <div class="wide"><label for="api_key">API Key</label><input id="api_key" type="password" autocomplete="off" placeholder="尚未配置"><small>已配置时显示占位符，不输入新值不会修改原 Key。</small></div>
        <div><label for="translation_model">翻译模型</label><input id="translation_model" required value="deepseek-v4-flash"></div>
        <div><label for="summary_model">摘要模型</label><input id="summary_model" required></div>
      </div>
    </section>
    <details class="card">
      <summary><h2>更多设置</h2></summary>
      <div class="details-body grid">
        <div><label for="whisper_model">Whisper 多语言模型</label><select id="whisper_model"><option>tiny</option><option>base</option><option selected>small</option><option>medium</option></select><small>固定使用多语言权重，可识别英文、日文和中文。</small></div>
        <div><label for="device">运行设备</label><select id="device"><option value="cpu">仅 CPU（默认，无需额外配置）</option><option value="auto">自动（GPU 优先，失败转 CPU）</option><option value="cuda">仅 NVIDIA GPU</option></select><small>安装 GPU 运行库后可主动切换为“自动”或“仅 NVIDIA GPU”。</small></div>
        <div class="wide"><label for="whisper_model_path">本机模型路径（可选）</label><input id="whisper_model_path" placeholder="留空则自动查找和下载"><small>需包含 config.json、tokenizer.json 与 model.bin；保存后可自动检查。</small></div>
        <div><label for="whisper_download_source">下载源</label><select id="whisper_download_source"><option value="auto">自动（镜像优先，官方回退）</option><option value="mirror">仅 Hugging Face 镜像</option><option value="official">仅 Hugging Face 官方</option></select></div>
        <div><label>面板背景透明度</label><div class="range-row"><input id="panel_opacity" type="range" min="72" max="100" value="94"><output id="opacity_value">94%</output></div></div>
        <div class="wide model-status">
          <div class="status-line"><strong>Whisper 模型</strong><span id="model_state" class="status-value">尚未检查</span></div>
          <div id="model_progress" class="progress" hidden><i id="model_bar"></i></div>
          <div id="model_detail" class="path">保存设置后点击“检查模型”。</div>
          <div class="actions"><button type="button" id="check_model" class="secondary">检查模型</button><button type="button" id="open_model" class="secondary" disabled>打开模型文件夹</button><button type="button" id="download_model">下载 / 继续下载</button></div>
        </div>
        <div class="wide model-status">
          <div class="status-line"><strong>GPU 运行库</strong><span id="cuda_state" class="status-value">尚未检查</span></div>
          <div id="cuda_progress" class="progress" hidden><i id="cuda_bar"></i></div>
          <div id="cuda_detail" class="path">默认使用 CPU。主动安装约需下载 1.37 GB，不修改系统 CUDA 或环境变量。</div>
          <div class="actions"><button type="button" id="check_cuda" class="secondary">检查 GPU 环境</button><button type="button" id="open_cuda" class="secondary" disabled>打开运行库文件夹</button><button type="button" id="install_cuda">一键配置 GPU</button></div>
        </div>
      </div>
    </details>
    <div class="actions"><button>保存设置</button><button type="button" class="secondary" id="reset_translation">恢复默认翻译模型</button><span id="message"></span></div>
  </form>
  <script src="options.js"></script>
</body>
</html>
<!-- Moon End -->
