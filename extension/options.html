<!-- Moon Begin -->
<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>双语字幕助手设置</title>
  <style>
    :root{color-scheme:dark}*{box-sizing:border-box}body{max-width:820px;margin:36px auto;padding:0 20px;background:#101218;color:#eef1f7;font:15px/1.55 Arial,"Microsoft YaHei",sans-serif}h1{margin-bottom:6px}h2,h3{margin:0}h2{font-size:17px}h3{font-size:16px}.card{margin:20px 0;padding:22px;background:linear-gradient(145deg,#181c25,#151820);border:1px solid #303745;border-radius:14px;box-shadow:0 12px 35px #0003}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.wide{grid-column:1/-1}.field-head,.group-head,.status-line{display:flex;align-items:center;justify-content:space-between;gap:12px}.field-head label{margin:0}.field-head{margin-bottom:6px}label{display:block;margin-bottom:6px;color:#dce2ee}input,select{width:100%;padding:10px 11px;background:#222733;color:#fff;border:1px solid #424b5c;border-radius:7px;transition:border-color .16s ease,box-shadow .16s ease,background .16s ease}input:hover,select:hover{border-color:#58657a}input:focus-visible,select:focus-visible{outline:0;border-color:#6c9cff;box-shadow:0 0 0 3px #3978e833}small{display:block;margin-top:5px;color:#9da8b8}details summary{display:flex;align-items:center;justify-content:space-between;cursor:pointer;list-style:none}details summary::after{content:"＋";font-size:21px;color:#78a4ff}details[open] summary::after{content:"−"}.details-body{margin-top:20px;padding-top:18px;border-top:1px solid #303745}.settings-group{padding:18px;background:#10141c;border:1px solid #303846;border-radius:11px}.group-fields{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:15px}.actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:16px}button{padding:10px 16px;color:#fff;background:#3978e8;border:1px solid transparent;border-radius:7px;cursor:pointer;transition:transform .12s ease,background .16s ease,border-color .16s ease,box-shadow .16s ease}button.secondary{background:#343b49}button:not(:disabled):hover{background:#4a86ef;box-shadow:0 5px 14px #1e55b84d}button.secondary:not(:disabled):hover{background:#414a5b;border-color:#59667c;box-shadow:0 5px 14px #0003}button:not(:disabled):active{transform:translateY(1px) scale(.98);box-shadow:none}button:focus-visible{outline:0;box-shadow:0 0 0 3px #78a4ff4d}button:disabled{opacity:.5;cursor:default}.status-value{min-width:42px;text-align:right;color:#9da8b8;font-size:13px;font-variant-numeric:tabular-nums}.status-value.ready{color:#65d59a}.status-value.failed{color:#ff8b91}.status-value.checking::before{content:"";display:inline-block;width:7px;height:7px;margin-right:6px;border:1.5px solid currentColor;border-right-color:transparent;border-radius:50%;vertical-align:0;animation:status-spin .75s linear infinite}.progress{height:7px;margin:13px 0 0;background:#2c3340;border-radius:9px;overflow:hidden}.progress[hidden]{display:none}.progress i{display:block;width:0;height:100%;background:linear-gradient(90deg,#4b8cff,#9575ff);transition:width .25s ease-out}.status-detail{margin-top:10px;word-break:break-word;color:#aab5c8;font-size:12px;font-variant-numeric:tabular-nums}.range-row{display:flex;align-items:center;gap:14px;margin-top:13px}.range-row input{padding:0}.range-row output{min-width:44px;color:#8fb3ff}@keyframes status-spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){*,*::before{scroll-behavior:auto!important;transition-duration:0s!important;animation-duration:0s!important}}@media(max-width:650px){.grid,.group-fields{grid-template-columns:1fr}.wide{grid-column:auto}}
  </style>
</head>
<body>
  <h1>视频 AI 双语字幕助手</h1>
  <form id="form">
    <section class="card">
      <h2>模型服务</h2>
      <div class="grid">
        <div class="wide"><label for="base_url">OpenAI 兼容 Base URL</label><input id="base_url" required></div>
        <div class="wide"><label for="api_key">API Key</label><input id="api_key" type="password" autocomplete="off" placeholder="尚未配置"><small>已配置时显示占位符，不输入新值不会修改原 Key。</small></div>
        <div><label for="translation_model">翻译模型</label><input id="translation_model" required value="deepseek-v4-flash"></div>
        <div><label for="summary_model">摘要模型</label><input id="summary_model" required></div>
      </div>
    </section>
    <details class="card">
      <summary><h2>更多设置</h2></summary>
      <div class="details-body grid">
        <section class="wide settings-group">
          <div class="group-head"><h3>Whisper 模型</h3></div>
          <div class="group-fields">
            <div><div class="field-head"><label for="whisper_model">模型</label><span id="model_state" class="status-value">尚未检查</span></div><select id="whisper_model"><option value="tiny">tiny</option><option value="base">base</option><option value="small" selected>small</option><option value="medium">medium</option></select></div>
            <div><label for="whisper_download_source">下载源</label><select id="whisper_download_source"><option value="auto">自动（镜像优先，官方回退）</option><option value="mirror">仅 Hugging Face 镜像</option><option value="official">仅 Hugging Face 官方</option></select></div>
            <div class="wide"><label for="whisper_model_path">本机模型路径（可选）</label><input id="whisper_model_path" placeholder="留空则自动查找和下载"></div>
          </div>
          <div id="model_progress" class="progress" hidden><i id="model_bar"></i></div>
          <div id="model_detail" class="status-detail" hidden></div>
          <div class="actions"><button type="button" id="check_model" class="secondary">检查模型</button><button type="button" id="open_model" class="secondary" disabled>打开模型文件夹</button><button type="button" id="download_model">下载 / 继续下载</button><button type="button" id="cancel_model_download" class="secondary cancel-download" hidden>取消下载</button></div>
        </section>
        <section class="wide settings-group">
          <div class="group-head"><h3>GPU 加速</h3><span id="cuda_state" class="status-value">尚未检查</span></div>
          <div class="group-fields"><div class="wide"><label for="device">运行设备</label><select id="device"><option value="cpu">仅 CPU（默认，无需额外配置）</option><option value="auto">自动（GPU 优先，失败转 CPU）</option><option value="cuda">仅 NVIDIA GPU</option></select></div></div>
          <div id="cuda_progress" class="progress" hidden><i id="cuda_bar"></i></div>
          <div id="cuda_detail" class="status-detail" hidden></div>
          <div class="actions"><button type="button" id="check_cuda" class="secondary">检查 GPU 环境</button><button type="button" id="open_cuda" class="secondary" disabled>打开运行库文件夹</button><button type="button" id="install_cuda">一键配置 GPU</button><button type="button" id="cancel_cuda_download" class="secondary cancel-download" hidden>取消下载</button></div>
        </section>
        <section class="wide settings-group"><div class="group-head"><h3>面板</h3></div><div class="range-row"><label for="panel_opacity">背景透明度</label><input id="panel_opacity" type="range" min="72" max="100" value="94"><output id="opacity_value">94%</output></div></section>
      </div>
    </details>
    <div class="actions"><button>保存设置</button><button type="button" class="secondary" id="reset_translation">恢复默认翻译模型</button><span id="message"></span></div>
  </form>
  <script src="options.js"></script>
</body>
</html>
<!-- Moon End -->
