<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>双语字幕助手设置</title><style>body{max-width:720px;margin:40px auto;background:#121419;color:#eef1f5;font:15px Arial}label{display:block;margin:16px 0 6px}input,select{width:100%;padding:9px;background:#20242c;color:#fff;border:1px solid #414958;border-radius:6px;box-sizing:border-box}small{display:block;margin-top:6px;color:#9da6b4}button{margin-top:22px;padding:10px 18px;background:#2867d6;color:#fff;border:0;border-radius:6px}.secondary{background:#343945;margin-left:8px}#message{margin-left:12px}</style></head><body><h1>视频 AI 双语字幕助手</h1><p>支持 YouTube 与 Bilibili 英文/日文视频。配置保存在本机服务目录；处理时字幕会发送到你配置的模型服务。</p><form id="form"><label>OpenAI 兼容 Base URL</label><input id="base_url" required><label>API Key</label><input id="api_key" type="password" autocomplete="off" placeholder="尚未配置"><small>已配置时显示占位符；不输入新值就不会修改原 Key。</small><label>翻译模型</label><input id="translation_model" required value="deepseek-v4-flash"><small>默认使用 deepseek-v4-flash。</small><label>摘要模型</label><input id="summary_model" required><label>Whisper 多语言模型</label><select id="whisper_model"><option>tiny</option><option>base</option><option selected>small</option><option>medium</option></select><small>自动识别英文/日文；旧版 .en 配置会自动升级为多语言模型。</small><label>运行设备</label><select id="device"><option value="auto">自动（GPU 优先，失败转 CPU）</option><option value="cuda">仅 NVIDIA GPU</option><option value="cpu">仅 CPU</option></select><button>保存设置</button><button type="button" class="secondary" id="reset_translation">恢复默认翻译模型</button><span id="message"></span></form><script src="options.js"></script></body></html>
