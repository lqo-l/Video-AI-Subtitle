<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><style>body{width:260px;padding:14px;background:#15171c;color:#fff;font:14px Arial}button{width:100%;margin-top:8px;padding:9px;border:0;border-radius:6px;background:#2867d6;color:#fff;cursor:pointer}.secondary{background:#343945}.danger{background:#6b3035}button:disabled{opacity:.55;cursor:wait}#status{color:#abb3c0;margin-bottom:8px}.update{display:none;margin:0 0 10px;padding:9px 10px;border:1px solid #4d78c7;border-radius:8px;background:#1c2a43;color:#d9e7ff}.update.show{display:block}.update strong{display:block}.update small{display:block;margin-top:3px;color:#aebfdc}.update-actions{display:flex;gap:7px}.update-actions button{margin-top:8px}.update-actions button{width:auto;flex:1}</style></head><body><div class="update" id="update"><strong id="update_title"></strong><small id="update_note"></small><div class="update-actions"><button id="open_update">查看更新</button></div></div><div id="status">检查本机服务…</div><button id="start">处理当前视频</button><button class="secondary" id="options">设置</button><button class="secondary" id="check_update">检查插件更新</button><button class="danger" id="clear_cache">清理字幕缓存</button><script src="popup.js"></script></body></html>
